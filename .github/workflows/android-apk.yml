name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - jump-fix

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Create debug keystore
        run: |
          mkdir -p build
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/build/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
      - name: Enable ETC2 ASTC
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("project.godot")
          text = path.read_text(encoding="utf-8")
          setting = "textures/vram_compression/import_etc2_astc=true"
          if setting not in text:
              text = text.replace("[rendering]", "[rendering]\n" + setting, 1)
              path.write_text(text, encoding="utf-8")
          PY
          grep -n "import_etc2_astc" project.godot
      - name: Apply gameplay and flight fixes
        run: python3 scripts/build_patch.py
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Validate project invariants
        run: bash ./validate_project.sh
      - name: Build APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/build/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/retro_runner.apk
      - name: Check APK
        run: |
          ls -lh build/
          test -f build/retro_runner.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: retro-runner-apk
          path: build/retro_runner.apk
          if-no-files-found: error