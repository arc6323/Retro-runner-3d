name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - jump-fix

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Create debug keystore
        run: |
          mkdir -p build
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/build/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
      - name: Enable ETC2 ASTC
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("project.godot")
          text = path.read_text(encoding="utf-8")
          setting = "textures/vram_compression/import_etc2_astc=true"
          if setting not in text:
              text = text.replace("[rendering]", "[rendering]\n" + setting, 1)
              path.write_text(text, encoding="utf-8")
          PY
          grep -n "import_etc2_astc" project.godot
      - name: Apply flight artifact schedule
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("scripts/game_base.gd")
          text = path.read_text(encoding="utf-8")
          old_types = 'var types := ["coin", "coin", "magnet", "coin", "coin", "flight", "coin", "magnet", "coin", "coin", "coin", "flight", "coin", "magnet", "coin", "coin", "coin", "flight", "coin", "coin"]'
          new_types = 'var types := ["coin", "coin", "magnet", "coin", "coin", "flight", "coin", "magnet", "coin", "coin", "coin", "coin", "coin", "magnet", "coin", "coin", "coin", "coin", "coin", "coin"]'
          if old_types not in text:
              raise SystemExit("flight pickup list pattern not found")
          text = text.replace(old_types, new_types, 1)
          old_pos = 'pickup.position = Vector3(LANE_X[index % 5], 0.9 if pickup_type == "coin" else 1.05, -18.0 - float(index) * 18.0)'
          new_pos = 'pickup.position = Vector3(LANE_X[index % 5], 0.9 if pickup_type == "coin" else 1.05, -4000.0 if pickup_type == "flight" else -18.0 - float(index) * 18.0)'
          if old_pos not in text:
              raise SystemExit("pickup position pattern not found")
          text = text.replace(old_pos, new_pos, 1)
          path.write_text(text, encoding="utf-8")
          PY
          grep -n 'var types :=' scripts/game_base.gd
          grep -n '4000.0 if pickup_type' scripts/game_base.gd
      - name: Apply gameplay motion fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          loop = Path("scripts/play_loop.gd")
          text = loop.read_text(encoding="utf-8")

          old_speed = 'g.set_meta("current_speed_kmh", current_speed * 3.6)'
          new_speed = 'g.set_meta("physical_speed_kmh", current_speed * 3.6)'
          if old_speed not in text:
              raise SystemExit("physical speed marker not found")
          text = text.replace(old_speed, new_speed, 1)

          old_pickup = '''\t\tif g.magnet_remaining > 0.0 and pickup_type == "coin":
\t\t\tvar distance_to_player: float = Vector2(pickup.position.x - player_local_x, pickup.position.z - player_z).length()
\t\t\tif distance_to_player < MAGNET_RANGE:
\t\t\t\tpickup.position.x = lerpf(pickup.position.x, player_local_x, min(1.0, delta * 8.0))
\t\t\t\tpickup.position.z = lerpf(pickup.position.z, player_z, min(1.0, delta * 8.0))
\t\t\t\tpickup.position.z += current_speed * delta
'''
          new_pickup = '''\t\tif g.magnet_remaining > 0.0 and pickup_type == "coin":
\t\t\tvar distance_to_player: float = Vector2(pickup.position.x - player_local_x, pickup.position.z - player_z).length()
\t\t\tif distance_to_player < MAGNET_RANGE:
\t\t\t\tpickup.position.x = lerpf(pickup.position.x, player_local_x, min(1.0, delta * 8.0))
\t\t\t\tpickup.position.z = lerpf(pickup.position.z, player_z, min(1.0, delta * 8.0))
\t\t# Every pickup must move toward the player with the world, not only coins inside magnet range.
\t\tpickup.position.z += current_speed * delta
'''
          if old_pickup not in text:
              raise SystemExit("pickup movement pattern not found")
          text = text.replace(old_pickup, new_pickup, 1)

          old_flight_visual = '''\tif g.flight_remaining > 0.0:
\t\tg.ramp_used = true
\t\tg.jumping = false
\t\tg.jump_velocity = 0.0
\t\tg.trick_requested = false
\t\tg.vehicle_visual.rotation_degrees.x = 0.0
\t\tg.wolf.rotation_degrees.x = 0.0
\t\treturn
'''
          new_flight_visual = '''\tif g.flight_remaining > 0.0:
\t\tg.ramp_used = true
\t\tg.jumping = false
\t\tg.jump_velocity = 0.0
\t\tg.trick_requested = false
\t\tvar flight_phase: float = sin(g.elapsed_time * 5.0)
\t\tg.vehicle_visual.rotation_degrees.x = -4.0 + flight_phase * 1.5
\t\tg.wolf.rotation_degrees.x = -3.7 + flight_phase * 1.4
\t\treturn
'''
          if old_flight_visual not in text:
              raise SystemExit("flight visual pattern not found")
          text = text.replace(old_flight_visual, new_flight_visual, 1)

          loop.write_text(text, encoding="utf-8")

          action = Path("scripts/play_action.gd")
          text = action.read_text(encoding="utf-8")
          old_read = 'var physical_speed_kmh: float = float(g.get_meta("current_speed_kmh", 0.0))'
          new_read = 'var physical_speed_kmh: float = float(g.get_meta("physical_speed_kmh", g.BASE_SPEED * 3.0 * 3.6))'
          if old_read not in text:
              raise SystemExit("HUD speed read pattern not found")
          text = text.replace(old_read, new_read, 1)
          action.write_text(text, encoding="utf-8")

          # Do not snap the player to flight altitude when the pickup is collected.
          # update_running() now performs a smooth takeoff/landing interpolation.
          loop = Path("scripts/play_loop.gd")
          text = loop.read_text(encoding="utf-8")
          old_snap = '\t\tg.player.position.y = 2.8\n'
          if old_snap not in text:
              raise SystemExit("flight altitude snap pattern not found")
          text = text.replace(old_snap, '', 1)
          loop.write_text(text, encoding="utf-8")
          PY
          grep -n 'physical_speed_kmh' scripts/play_loop.gd scripts/play_action.gd
          grep -n 'pickup.position.z += current_speed' scripts/play_loop.gd
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Validate project invariants
        run: bash ./validate_project.sh
      - name: Build APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/build/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/retro_runner.apk
      - name: Check APK
        run: |
          ls -lh build/
          test -f build/retro_runner.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: retro-runner-apk
          path: build/retro_runner.apk
          if-no-files-found: error